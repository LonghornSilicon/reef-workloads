[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workloads"
version = "0.1.0"
description = "Benchmark AI models and inference workloads for Reef."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff==0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workloads"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow",
]
timeout = 300
testpaths = ["tests"]
norecursedirs = [
    "data",
    "results",
]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "B",      # bugbear
    "UP",     # modern Python syntax
    "SIM",    # simplify code
    "ANN",    # type annotations
    "D",      # docstrings
    "RET",    # return statement consistency
    "RUF",    # Ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
